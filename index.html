<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem-vindo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>BEM VINDO</h1>
    <p class="sub">Entre ou crie sua conta.</p>

    <div class="tabs">
      <button id="tab-login" class="active" type="button">Entrar</button>
      <button id="tab-signup" type="button">Criar conta</button>
    </div>

    <!-- Login -->
    <form id="form-login">
      <label>Email
        <input id="login-email" type="email" required autocomplete="email">
      </label>
      <label>Senha
        <input id="login-password" type="password" required autocomplete="current-password">
      </label>
      <button class="btn" type="submit">Entrar</button>
      <p class="link"><a href="#" id="link-esqueci">Esqueci minha senha</a></p>
    </form>

    <!-- Cadastro -->
    <form id="form-signup" class="hidden">
      <label>Nome de usuário
        <input id="signup-username" required pattern="[a-zA-Z0-9_.]{3,20}" title="3 a 20 caracteres: letras, números, _ ou ." autocomplete="username">
      </label>
      <label>Nome completo
        <input id="signup-fullname" required autocomplete="name">
      </label>
      <label>Email
        <input id="signup-email" type="email" required autocomplete="email">
      </label>
      <label>Senha (mínimo 6 caracteres)
        <input id="signup-password" type="password" required minlength="6" autocomplete="new-password">
      </label>
      <button class="btn" type="submit">Criar conta</button>
    </form>

    <!-- Esqueci minha senha: pede o link por email -->
    <form id="form-esqueci" class="hidden">
      <p class="sub">Informe seu email e enviaremos um link para criar uma nova senha.</p>
      <label>Email
        <input id="esqueci-email" type="email" required autocomplete="email">
      </label>
      <button class="btn" type="submit">Enviar link</button>
      <p class="link"><a href="#" id="link-voltar">Voltar ao login</a></p>
    </form>

    <!-- Nova senha: aparece ao abrir o link do email -->
    <form id="form-nova" class="hidden">
      <label>Nova senha (mínimo 6 caracteres)
        <input id="nova-senha" type="password" required minlength="6" autocomplete="new-password">
      </label>
      <label>Repita a nova senha
        <input id="nova-senha2" type="password" required minlength="6" autocomplete="new-password">
      </label>
      <button class="btn" type="submit">Salvar nova senha</button>
    </form>

    <p id="msg" class="msg"></p>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $("msg");
    const setMsg = (text, type = "") => { msg.textContent = text; msg.className = "msg " + type; };

    const configOk = window.SUPABASE_URL && !window.SUPABASE_URL.includes("SEU-PROJETO");
    if (!configOk) setMsg("Configure o config.js com a URL e a chave do Supabase.", "error");
    const sb = configOk ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

    const tabLogin = $("tab-login");
    const tabSignup = $("tab-signup");
    const formLogin = $("form-login");
    const formSignup = $("form-signup");
    const formEsqueci = $("form-esqueci");
    const formNova = $("form-nova");
    const abas = document.querySelector(".tabs");
    const todosForms = [formLogin, formSignup, formEsqueci, formNova];

    // Mostra apenas um formulário (ou nenhum, se for null)
    function mostrar(form) { todosForms.forEach((f) => f.classList.toggle("hidden", f !== form)); }

    tabLogin.onclick = () => {
      tabLogin.classList.add("active"); tabSignup.classList.remove("active");
      mostrar(formLogin); setMsg("");
    };
    tabSignup.onclick = () => {
      tabSignup.classList.add("active"); tabLogin.classList.remove("active");
      mostrar(formSignup); setMsg("");
    };

    function esconderLogin() { abas.classList.add("hidden"); mostrar(null); }
    function mostrarLogin() { abas.classList.remove("hidden"); tabLogin.click(); }
    function limparExtras() { document.querySelectorAll(".extra").forEach((e) => e.remove()); }
    function addBotao(texto, classe, fn) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn extra " + (classe || "");
      b.textContent = texto;
      b.onclick = fn;
      msg.insertAdjacentElement("afterend", b);
      return b;
    }

    async function sair() {
      await sb.auth.signOut();
      limparExtras();
      mostrarLogin();
    }

    // Esqueci minha senha
    $("link-esqueci").onclick = (e) => {
      e.preventDefault();
      abas.classList.add("hidden");
      mostrar(formEsqueci);
      setMsg("");
    };
    $("link-voltar").onclick = (e) => { e.preventDefault(); mostrarLogin(); };

    formEsqueci.onsubmit = async (e) => {
      e.preventDefault();
      if (!sb) return;
      const btn = formEsqueci.querySelector("button");
      btn.disabled = true;
      const { error } = await sb.auth.resetPasswordForEmail($("esqueci-email").value.trim(), {
        redirectTo: new URL("index.html", location.href).href,
      });
      btn.disabled = false;
      if (error) return setMsg(traduzErro(error.message), "error");
      formEsqueci.reset();
      setMsg("Se o email estiver cadastrado, você receberá um link para criar uma nova senha.", "ok");
    };

    // Ao abrir o link do email, o Supabase dispara PASSWORD_RECOVERY: mostra a tela de nova senha
    sb && sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        esconderLogin();
        mostrar(formNova);
        setMsg("Defina sua nova senha.", "ok");
      }
    });

    formNova.onsubmit = async (e) => {
      e.preventDefault();
      if (!sb) return;
      const p1 = $("nova-senha").value;
      if (p1 !== $("nova-senha2").value) return setMsg("As senhas não conferem.", "error");
      // A senha nova só vale depois que o admin aprovar
      const { error } = await sb.rpc("request_password_change", { p_password: p1 });
      if (error) return setMsg(traduzErro(error.message), "error");
      await sb.auth.signOut();
      formNova.reset();
      history.replaceState(null, "", location.pathname);
      mostrarLogin();
      setMsg("Nova senha recebida. Ela passa a valer depois que o admin aprovar.", "ok");
    };

    // Cadastro: o trigger no banco cria o perfil com status 'pending'
    formSignup.onsubmit = async (e) => {
      e.preventDefault();
      if (!sb) return;
      const btn = formSignup.querySelector("button");
      btn.disabled = true;
      const { error } = await sb.auth.signUp({
        email: $("signup-email").value.trim(),
        password: $("signup-password").value,
        options: {
          // Para onde o link do email deve voltar (a página atual, sem localhost)
          emailRedirectTo: new URL("index.html", location.href).href,
          data: {
            username: $("signup-username").value.trim(),
            full_name: $("signup-fullname").value.trim(),
          },
        },
      });
      btn.disabled = false;
      if (error) return setMsg(traduzErro(error.message), "error");
      formSignup.reset();
      setMsg("Cadastro enviado! Aguarde a aprovação do admin.", "ok");
    };

    // Login: o usuário entra no Auth, e o status do perfil decide o que ele vê
    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      if (!sb) return;
      const email = $("login-email").value.trim();
      const { data, error } = await sb.auth.signInWithPassword({
        email,
        password: $("login-password").value,
      });
      if (error) {
        if (/Email not confirmed/i.test(error.message)) return mostrarPendenteConfirmacao(email);
        return setMsg(traduzErro(error.message), "error");
      }
      checarPerfil(data.user, "login");
    };

    // Conta criada, mas o email ainda não foi confirmado: oferece reenviar o link
    function mostrarPendenteConfirmacao(email) {
      limparExtras();
      setMsg("Seu cadastro está pendente de confirmação. Confira sua caixa de entrada (e o spam) e clique no link do email.", "error");
      addBotao("Reenviar email de confirmação", "", async (ev) => {
        const b = ev.currentTarget;
        b.disabled = true;
        const { error } = await sb.auth.resend({
          type: "signup",
          email,
          options: { emailRedirectTo: new URL("index.html", location.href).href },
        });
        b.disabled = false;
        if (error) return setMsg(traduzErro(error.message), "error");
        setMsg("Novo email de confirmação enviado. Confira sua caixa de entrada.", "ok");
      });
    }

    // Decide a tela pelo status do perfil. tipo ('login' | 'visit' | null) registra o acesso.
    async function checarPerfil(user, tipo) {
      const { data: perfil, error } = await sb
        .from("profiles")
        .select("full_name, status, role, unblock_requested")
        .eq("id", user.id)
        .single();
      limparExtras();

      if (error || !perfil) {
        await sair();
        return setMsg("Perfil não encontrado.", "error");
      }

      if (perfil.status === "approved") {
        if (tipo) {
          const { error: errAcesso } = await sb.rpc("register_access", { p_kind: tipo });
          if (errAcesso) console.warn("Não foi possível registrar o acesso:", errAcesso.message);
        }
        esconderLogin();
        setMsg(`Bem-vindo, ${perfil.full_name}!` + (perfil.role === "admin" ? " (admin)" : ""), "ok");
        if (perfil.role === "admin") addBotao("Ir para o painel", "", () => (location.href = "admin.html"));
        addBotao("Sair", "secondary", async () => { await sair(); setMsg(""); });
      } else if (perfil.status === "pending") {
        await sair();
        setMsg("Seu cadastro está aguardando aprovação do admin.", "error");
      } else if (perfil.status === "blocked") {
        esconderLogin();
        if (perfil.unblock_requested) {
          setMsg("Sua conta está bloqueada. O pedido de desbloqueio já foi enviado; aguarde o admin.", "error");
        } else {
          setMsg("Sua conta está bloqueada.", "error");
          addBotao("Solicitar desbloqueio", "", async () => {
            const { error: errReq } = await sb.rpc("request_unblock");
            if (errReq) return setMsg(traduzErro(errReq.message), "error");
            checarPerfil(user, null);
          });
        }
        addBotao("Sair", "secondary", async () => { await sair(); setMsg(""); });
      }
    }

    // Ao abrir a página com sessão ativa, verifica o status e conta a visita.
    // Links de redefinição de senha são tratados pelo evento PASSWORD_RECOVERY.
    (async () => {
      if (!sb) return;
      if (location.hash.includes("type=recovery")) return;
      const { data: { session } } = await sb.auth.getSession();
      if (session) checarPerfil(session.user, "visit");
    })();

    function traduzErro(m) {
      if (/Invalid login/i.test(m)) return "Email ou senha incorretos.";
      if (/Email not confirmed/i.test(m)) return "Seu cadastro está pendente de confirmação.";
      if (/seconds|rate limit|security purposes/i.test(m)) return "Aguarde alguns segundos antes de tentar de novo.";
      if (/already registered|already exists|duplicate/i.test(m)) return "Já existe um cadastro com esse email ou usuário.";
      if (/least 6/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
      if (/different from the old|same password/i.test(m)) return "A nova senha precisa ser diferente da anterior.";
      if (/bloqueada/i.test(m)) return "A conta não está bloqueada.";
      return m;
    }
  </script>
</body>
</html>
